<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>¿Qué sale?</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conecta con estudiantes de tu universidad que comparten tus gustos y convierte esa afinidad en un plan.">
  <meta name="theme-color" content="#b84100">
  <script>
    try {
      var t = localStorage.getItem('quesale-tema');
      if (t === 'oscuro' || (t !== 'claro' && matchMedia('(prefers-color-scheme: dark)').matches)) {
        document.documentElement.classList.add('oscuro');
        document.querySelector('meta[name="theme-color"]').setAttribute('content', '#12151c');
      }
    } catch (e) {}
  </script>
  <link rel="icon" href="favicon.ico?v=2" sizes="48x48">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
  <link rel="apple-touch-icon" href="apple-touch-icon.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
</head>

</body>
</html>
