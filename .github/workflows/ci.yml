name: CI

on:
  push:
    branches: [main, dev, dev-qa/andre]
  workflow_dispatch:
  pull_request:
    branches: [main, dev, dev-qa/andre]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Probar
        run: npm test -- --watch=false
      - name: Compilar
        run: npm run build
